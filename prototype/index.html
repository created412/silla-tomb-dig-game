<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>토우 친구들과 신라 발굴 도전</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage" data-phase="title">
    <canvas id="dig" aria-label="발굴 현장"></canvas>

    <div id="hud" class="hidden">
      <div id="level-name"></div>
      <div id="hint">손가락으로 쓱쓱 문질러!</div>
      <div id="cracks" aria-label="유물 금" title="유물에 간 금. 3개면 깨져!">
        <span class="crack">⚡</span><span class="crack">⚡</span><span class="crack">⚡</span>
      </div>
    </div>

    <div id="powers" class="hidden" aria-label="토우 능력"></div>

    <div id="dialogue" class="story-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="dialogue-title">
      <div class="story-spread">
        <div class="scene-picture">
          <canvas id="dialogue-scene" data-scene="0" aria-label="토우 친구들의 모험 그림"></canvas>
          <p class="scene-label" id="dialogue-title">토우 친구들의 이야기</p>
        </div>
        <div class="story-copy">
          <div class="speaker-heading"><canvas id="dialogue-actor" data-actor="frog" aria-hidden="true"></canvas><span id="speaker">두꺼비</span><span id="dialogue-page"></span></div>
          <p id="line" aria-live="polite"></p>
          <div class="voice-controls"><button data-voice-replay>↻ 다시 듣기</button><button data-voice-mute aria-pressed="false">소리 켜짐</button><span data-voice-status></span></div>
          <button id="dialogue-next" class="big story-next">다음 이야기 <span id="tap-hint">→</span></button>
        </div>
      </div>
    </div>

    <div id="title" class="overlay">
      <div class="title-box">
        <p class="kicker">살살, 천천히. 유물을 깨뜨리지 말고!</p>
        <h1>토우 친구들과<br><span class="gold">신라 발굴 도전</span></h1>
        <div id="levels" aria-label="무덤 고르기"></div>
        <div class="row title-row"><button id="btn-dex" class="big ghost">🐸 토우 친구들</button><div id="shelf" aria-label="찾은 유물"></div></div>
        <p class="sub">흙은 문질러 · 돌은 톡톡 · 나무는 붓으로 살살</p>
      </div>
    </div>

    <div id="card" class="overlay hidden">
      <div class="panel">
        <p class="kicker" id="card-kicker"></p>
        <h2 id="card-title"></h2>
        <p id="card-info"></p>
        <div id="card-friends"></div>
        <p class="rule">⏳ 시간 제한 없음 · ⚡ 유물 위를 세게 문지르거나 찍으면 경고, 또 하면 금 · 금 3개면 깨져!</p>
        <div class="row">
          <button id="btn-start" class="big">파러 가자!</button>
          <button id="btn-back" class="big ghost">무덤 고르기</button>
        </div>
      </div>
    </div>

    <div id="result" class="bottom-panel hidden">
      <canvas id="result-art" class="hidden" data-art="crown" aria-hidden="true"></canvas>
      <div class="result-text">
        <h2 id="result-title"></h2>
        <div id="result-stars" class="hidden"><span>★</span><span>★</span><span>★</span></div>
        <p id="result-sub"></p>
      </div>
      <div class="row">
        <button id="btn-retry" class="big">다시 파기</button>
        <button id="btn-next" class="big">다음 무덤 ▶</button>
        <button id="btn-story" class="big ghost">유물 이야기</button>
        <button id="btn-home" class="big ghost">무덤 고르기</button>
      </div>
    </div>

    <div id="comic" class="story-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="comic-title">
      <div class="story-spread comic-box">
        <div class="scene-picture"><canvas id="comic-canvas" data-comic="" data-panel="0" aria-label="기억 조각 그림"></canvas><p class="scene-label" id="comic-title"></p></div>
        <div class="story-copy">
          <div class="speaker-heading"><canvas id="comic-actor" data-actor="frog" aria-hidden="true"></canvas><span id="comic-who"></span></div>
          <p id="comic-text" aria-live="polite"></p>
          <div id="comic-choices" class="hidden"></div>
          <div class="voice-controls"><button data-voice-replay>↻ 다시 듣기</button><button data-voice-mute aria-pressed="false">소리 켜짐</button><span data-voice-status></span></div>
          <button id="comic-next" class="big story-next" disabled>계속 발굴하기 →</button>
        </div>
      </div>
    </div>

    <div id="join" class="story-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="join-name">
      <div class="story-spread join-panel">
        <div class="scene-picture join-picture"><canvas data-scene="3" aria-hidden="true"></canvas><canvas id="join-actor" data-actor="frog" data-mood="artifactRevealed" aria-label="새 토우"></canvas><p class="scene-label">새 친구가 깨어났어!</p></div>
        <div class="story-copy">
          <h2 id="join-name"></h2>
          <p id="join-intro"></p>
          <p id="join-power"></p>
          <p id="join-when"></p>
          <div class="voice-controls"><button data-voice-replay>↻ 다시 듣기</button><button data-voice-mute aria-pressed="false">소리 켜짐</button><span data-voice-status></span></div>
          <button id="join-ok" class="big story-next">반가워! 함께 가자 →</button>
        </div>
      </div>
    </div>

    <div id="dex" class="overlay hidden">
      <div class="panel dex-panel">
        <button id="dex-close" class="big ghost">닫기 ×</button>
        <h2>토우 친구들</h2>
        <div class="dex-about">
          <img id="dex-shelf" src="assets/higgsfield/towoo-shelf.png" alt="선반 위 토우 인형들">
          <div id="dex-about-text"></div>
        </div>
        <div id="dex-cards"></div>
      </div>
    </div>

    <dialog id="story">
      <button id="story-close" class="big ghost">닫기 ×</button>
      <h2 id="story-title"></h2>
      <p id="story-meta"></p>
      <canvas id="story-art" data-art="crown" aria-label="유물 그림"></canvas>
      <p id="story-what"></p>
      <p id="story-hello"></p>
      <p id="story-note"></p>
      <div class="voice-controls"><button data-voice-replay>↻ 다시 듣기</button><button data-voice-mute aria-pressed="false">소리 켜짐</button><span data-voice-status></span></div>
    </dialog>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
