<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>토우 친구들과 무덤 주인 찾기 — 시제품</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="adventure.css">
  <link rel="stylesheet" href="companion.css">
</head>
<body>
  <main id="stage" data-phase="title">
    <canvas id="dig" aria-label="흙을 문지르고, 돌을 두드리고, 나무를 살살 쓸어 발굴하는 곳"></canvas>

    <header id="game-heading" class="hidden">
      <span class="game-name">토우 친구들과 무덤 주인 찾기</span>
      <span class="site-name">첫 번째 발굴</span>
    </header>

    <div id="hud" class="hidden">
      <div id="hint" aria-live="polite">손가락으로 쓱쓱 문질러!</div>
      <div id="friends-help"><button id="aid-turtle" class="hidden" type="button">거북! 돌 좀 도와줘</button><button id="aid-bird" class="hidden" type="button">새야! 어디에 있을까?</button></div>
      <aside id="layers" aria-label="발굴할 땅의 세 층">
        <div class="layer soil" data-layer="soil"><i id="bar-soil"></i><span>흙</span></div>
        <div class="layer rock" data-layer="rock"><i id="bar-rock"></i><span>돌</span></div>
        <div class="layer wood" data-layer="wood"><i id="bar-wood"></i><span>나무</span></div>
      </aside>
    </div>

    <button id="dialogue" class="hidden" type="button">
      <span id="speaker">개구리</span>
      <span id="line"></span>
      <span id="tap-hint">다음 <b>›</b></span>
    </button>

    <div id="discovery" class="hidden" aria-live="polite">
      <h2>찾았다, 신라의 금관!</h2>
      <p>나뭇가지 장식과 굽은 옥을 찾아봐.</p>
    </div>

    <div id="title" class="overlay">
      <div class="title-copy">
        <p class="intro">땅속에 잠든 신라의 이야기</p>
        <h1><span>토우 친구들과</span><br>무덤 주인 찾기</h1>
        <p class="sub">잠든 토우를 깨우면 새로운 능력이 생겨!<br>폴짝 뛰고, 훨훨 날아 신라의 기억을 찾아보자.</p>
        <button id="btn-start" class="big">파러 가자! <span aria-hidden="true">↗</span></button>
        <button id="btn-exhibit" class="hidden" type="button">내가 만든 전시 보기</button>
      </div>
      <p class="title-note">천마총·황남대총에서 착안한 가상 탐험 · 혼자 놀기</p>
    </div>

    <section id="story" class="hidden" aria-label="주인의 이야기" aria-labelledby="adv-title"></section>
    <section id="expedition" class="adventure hidden" aria-label="토우 능력 탐험"></section>
    <div id="again" class="overlay hidden">
      <div class="again-copy">
        <p class="sub">우리 손으로 금관을 찾았어!</p>
        <h1>또 파고 싶어?</h1>
        <div class="row">
          <button id="btn-again" class="big">응, 또!</button>
          <button id="btn-no" class="big ghost">아니</button>
        </div>
      </div>
    </div>
  </main>
  <footer id="save-controls" aria-label="진행 저장">
    <span id="save-status" role="status">저장하기를 눌러 진행을 남겨 줘.</span>
    <button id="btn-save" type="button">저장하기</button>
  </footer>
  <script type="module" src="src/main.js"></script>
</body>
</html>
