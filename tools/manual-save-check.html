<!doctype html><meta charset="utf-8"><title>수동 저장 검증</title>
<style>body{margin:0;font:16px sans-serif}header{height:48px;display:flex;align-items:center;gap:15px;padding:0 15px}button{padding:8px}iframe{display:block;width:100%;height:calc(100vh - 48px);border:0}</style>
<header><button id="run" disabled>수동 저장 검사</button><span id="status">준비 중</span></header><iframe></iframe>
<script type="module">
import {freshAdventure,ADVENTURE_KEY} from '../prototype/src/adventure-model.js';
import {ITEMS} from '../prototype/src/adventure-data.js';
import {layoutGrid} from '../prototype/src/grid.js';
const results=[],data=new Map(),status=document.querySelector('#status'),wait=ms=>new Promise(r=>setTimeout(r,ms));
let frame=document.querySelector('iframe'),d,w,writes=0,blocked=false;
window.testStorage={getItem:k=>data.get(k)??null,setItem(k,v){if(blocked)throw Error('Storage blocked');writes++;data.set(k,v);}};
const check=(ok,message)=>{results.push({pass:!!ok,message});document.body.dataset.results=JSON.stringify(results);if(!ok)throw Error(message);};
const click=q=>{const e=d.querySelector(q);if(!e||e.disabled)throw Error('Unavailable: '+q);e.click();};
const saved=()=>JSON.parse(data.get(ADVENTURE_KEY));
const html=(await(await fetch('../prototype/index.html')).text()).replace('<head>','<head><base href="../prototype/"><script>Object.defineProperty(window,"localStorage",{value:parent.testStorage});<\/script>');
async function load(){const next=document.createElement('iframe'),ready=new Promise(r=>next.onload=r);next.srcdoc=html;frame.replaceWith(next);frame=next;await ready;d=frame.contentDocument;w=frame.contentWindow;for(let n=0;n<240&&d.querySelector('#btn-start').childElementCount;n++)await wait(50);}
function startDig(){click('#btn-start');click('[data-map="0"]');click('[data-action="dig"]');}
async function rub(){const canvas=d.querySelector('#dig'),dp=canvas.width/canvas.clientWidth,l=layoutGrid({width:canvas.width,height:canvas.height-254*dp,cols:12,rows:7,padding:24*dp}),cell=ITEMS[0].cells[0];l.y0+=112*dp;const x=(l.x0+(cell%12+.5)*l.cell)/dp,y=(l.y0+(Math.floor(cell/12)+.5)*l.cell)/dp;const send=(type,x)=>canvas.dispatchEvent(new w.PointerEvent(type,{bubbles:true,pointerId:1,pointerType:'touch',isPrimary:true,clientX:x,clientY:y,buttons:type==='pointerup'?0:1}));send('pointerdown',x-6);for(let n=0;n<22;n++){await wait(35);send('pointermove',x+(n%2?6:-6));}send('pointerup',x);}
const initial=freshAdventure();initial.friends.push('frog');initial.routes.push('entry');data.set(ADVENTURE_KEY,JSON.stringify(initial));await load();document.querySelector('#run').disabled=false;status.textContent='준비 완료';
document.querySelector('#run').onclick=async()=>{try{
 check(!!d.querySelector('#btn-save'),'Save button is available');check(writes===0,'Loading does not write');const before=data.get(ADVENTURE_KEY);startDig();await rub();check(writes===0&&data.get(ADVENTURE_KEY)===before,'Digging does not autosave');check(d.querySelector('#save-status').textContent.includes('저장 안 된'),'Unsaved progress is visible');await load();check(writes===0,'Leaving does not autosave');startDig();click('#btn-save');check(writes===1&&saved().dig.soil[ITEMS[0].cells[0]]===1,'Unsaved excavation is discarded on reload');
 await rub();check(writes===1,'Further play does not overwrite save');click('#btn-save');check(writes===2&&saved().dig.soil[ITEMS[0].cells[0]]===0,'Save button stores excavation progress');check(d.querySelector('#save-status').textContent.includes('저장했어'),'Save success is visible');const last=data.get(ADVENTURE_KEY);blocked=true;click('#btn-save');check(data.get(ADVENTURE_KEY)===last&&d.querySelector('#save-status').textContent.includes('저장하지 못했어'),'Failed save preserves previous record');blocked=false;await load();startDig();click('#btn-save');check(saved().dig.soil[ITEMS[0].cells[0]]===0,'Explicitly saved excavation survives reload');
 data.set(ADVENTURE_KEY,JSON.stringify(freshAdventure()));await load();const count=writes;startDig();for(let n=0;n<3;n++)click(`[data-cover="${n}"]`);click('[data-trail="wake"]');check(writes===count&&!saved().friends.includes('frog'),'Companion reward does not autosave');click('#btn-save');check(saved().friends.includes('frog')&&writes===count+1,'Save button stores earned companion');await load();check(writes===count+1,'Saved companion reload does not write');click('#btn-start');check(!d.querySelector('#story .unmet [data-actor=frog]'),'Saved companion is restored');status.textContent=`완료: ${results.length}개 통과`;document.body.dataset.done='true';
 }catch(e){status.textContent='실패: '+e.message;console.error(e);}};
</script>
