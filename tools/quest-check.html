<!doctype html><meta charset="utf-8"><title>토우 능력 발굴 전체 검사</title>
<style>body{margin:0;background:#163b2b;color:#fff;font:14px sans-serif}header{height:48px;display:flex;align-items:center;gap:14px;padding:0 15px}button{padding:8px}iframe{width:100%;height:calc(100vh - 48px);border:0}</style>
<header><button id="run" disabled>새 모험 전체 검사</button><label><input id="pause" type="checkbox">첫 발굴에서 멈추기</label><button id="resume" disabled>계속</button><span id="status">준비 중</span></header><iframe></iframe>
<script type="module">
import {QUEST_KEY,MISSIONS} from '../prototype/src/quest-model.js';
import {ITEMS} from '../prototype/src/adventure-data.js';
import {layoutGrid} from '../prototype/src/grid.js';
const data=new Map(),results=[],wait=ms=>new Promise(r=>setTimeout(r,ms));let writes=0,blocked=false,frame=document.querySelector('iframe'),d,w;
window.testStorage={getItem:k=>data.get(k)??null,setItem:(k,v)=>{if(blocked)throw Error('Blocked');writes++;data.set(k,v);}};
const status=document.querySelector('#status');
function check(ok,message){results.push({pass:!!ok,message});document.body.dataset.results=JSON.stringify(results);status.textContent=message;if(!ok)throw Error(message);}
const html=(await(await fetch('../prototype/index.html')).text()).replace('<head>','<head><base href="../prototype/"><script>Object.defineProperty(window,"localStorage",{value:parent.testStorage});Object.defineProperty(window,"devicePixelRatio",{value:2});<\/script>');
async function until(fn){for(let n=0;n<260;n++){if(fn())return;await wait(50);}throw Error('Timed out');}
async function load(){const f=document.createElement('iframe'),p=new Promise(r=>f.onload=r);f.srcdoc=html;frame.replaceWith(f);frame=f;await p;d=f.contentDocument;w=f.contentWindow;await until(()=>d.querySelector('[data-action=new]'));w.addEventListener('error',e=>check(false,e.message));}
const click=q=>{const b=d.querySelector(q);if(!b||b.disabled)throw Error('Missing '+q);b.click();};
const read=()=>JSON.parse(data.get(QUEST_KEY));
function point(i){const c=d.querySelector('#dig'),r=c.getBoundingClientRect(),dp=c.width/r.width,l=layoutGrid({width:c.width,height:c.height-42*dp,cols:12,rows:7,padding:14*dp});l.y0+=8*dp;return {x:r.left+(l.x0+(i%12+.5)*l.cell)/dp,y:r.top+(l.y0+(Math.floor(i/12)+.5)*l.cell)/dp};}
function pointer(type,x,y){d.querySelector('#dig').dispatchEvent(new w.PointerEvent(type,{bubbles:true,pointerId:1,pointerType:'touch',isPrimary:true,clientX:x,clientY:y,buttons:type==='pointerup'?0:1}));}
async function power(who,cell){click(`[data-tool="${who}"]`);const p=point(cell);pointer('pointerdown',p.x,p.y);pointer('pointerup',p.x,p.y);await until(()=>!d.querySelector('#btn-save').disabled);}
async function stroke(cell){const p=point(cell);pointer('pointerdown',p.x-2,p.y);for(let n=0;n<32;n++){await wait(35);pointer('pointermove',p.x+(n%2?2:-2),p.y);}pointer('pointerup',p.x,p.y);}
await load();document.querySelector('#run').disabled=false;status.textContent='준비 완료';
document.querySelector('#run').onclick=async()=>{try{document.querySelector('#run').disabled=true;check(writes===0,'Loading does not autosave');click('[data-action=new]');for(let n=0;n<3;n++)click(`[data-patch="${n}"]`);check(writes===0,'Acquiring the toad does not autosave');click('#btn-save');check(read().friends.join()==='frog','First earned companion is the toad only');click('[data-action=wake-go]');
 for(let n=0;n<5;n++){const m=MISSIONS[n],cells=ITEMS.find(i=>i.id===m.id).cells,before=writes;await until(()=>d.querySelector('#dig'));check(d.querySelector('.q-top h2').textContent===m.title,`${m.id}: next excavation starts directly`);if(n<2)check(d.querySelector('[data-tool=turtle]').disabled,`${m.id}: unearned turtle is locked`);
  click('[data-tool=brush]');await stroke(cells[0]);check(d.querySelector('#q-progress').textContent.startsWith('0'),`${m.id}: required companions cannot be bypassed with the brush`);
  for(const who of m.need)for(const cell of cells)await power(who,cell);
  check(writes===before,`${m.id}: companion actions do not autosave`);click('#btn-save');const stored=read().dig;check(stored.used.length>=m.need.length,`${m.id}: ability use is saved`);check(cells.every(c=>stored.soil[c]===0),`${m.id}: toad clears actual excavation soil`);if(m.rock)check(cells.every(c=>stored.rock[c]===0),`${m.id}: turtle removes actual stones`);if(m.need.includes('snake'))check(cells.every(c=>stored.wood[c]<=.401&&stored.wood[c]>0),`${m.id}: snake opens the wood but preserves final brushing`);
  if(n===0){const previous=data.get(QUEST_KEY);blocked=true;click('#btn-save');check(data.get(QUEST_KEY)===previous&&d.querySelector('#save-status').textContent.includes('저장하지 못했어'),'Failed save leaves previous record intact');blocked=false;await load();click('[data-action=continue]');await until(()=>d.querySelector('#dig'));click('#btn-save');check(read().dig.soil[cells[0]]===0,'Saved excavation resumes at the same layer');if(document.querySelector('#pause').checked){status.textContent='첫 발굴 시각 검토';document.querySelector('#resume').disabled=false;await new Promise(r=>document.querySelector('#resume').onclick=r);document.querySelector('#resume').disabled=true;}}
  click('[data-tool=brush]');for(const cell of cells)await stroke(cell);await until(()=>d.querySelector('#quest-app').dataset.view==='reward');check(writes===before+1+(n===0?1:0),`${m.id}: discovery does not autosave`);click('#btn-save');const s=read();check(s.step===n+1&&s.relics.includes(m.id),`${m.id}: discovery advances story`);check(s.slots.every(x=>x===null),`${m.id}: no exhibition gate`);if(m.reward)check(s.friends.includes(m.reward),`${m.id}: new ${m.reward} companion is awarded`);click('[data-action=continue]');
 }
 await until(()=>d.querySelector('.q-survey-board'));click('[data-action=scan]');check(d.querySelector('#q-survey-count').textContent.startsWith('0'),'Final survey requires flying near the mound');for(const i of [0,1]){click(`[data-survey-target="${i}"]`);await until(()=>Math.abs(parseFloat(d.querySelector('#q-survey-bird').style.left)-(i===0?38:68))<1);click('[data-action=scan]');}
 check(d.querySelector('#quest-app').dataset.view==='ending','Two surveys complete the memory map');click('#btn-save');check(read().step===6&&read().relics.length===6&&read().friends.length===4,'All six discoveries and four companions persist');await load();click('[data-action=continue]');check(d.querySelector('#quest-app').dataset.view==='ending','Completed expedition resumes with optional replay');const saved=data.get(QUEST_KEY),count=writes;click('[data-action=home]');click('[data-action=new]');check(writes===count&&data.get(QUEST_KEY)===saved,'New adventure does not overwrite completed save');await load();click('[data-action=continue]');check(d.querySelector('#quest-app').dataset.view==='ending','Unsaved restart leaves saved adventure available');click('[data-action=museum]');click('[data-pick=crown]');click('[data-slot="0"]');check(writes===count,'Optional exhibition does not autosave');click('#btn-save');check(read().slots[0]==='crown'&&read().step===6,'Exhibition remains optional and saves manually');status.textContent=`완료: ${results.length}개 통과`;document.body.dataset.done='true';
 }catch(e){status.textContent='실패: '+e.message;document.body.dataset.error=e.message;console.error(e);}};
</script>
