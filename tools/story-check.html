<!doctype html><meta charset="utf-8"><title>발굴 화면 검증</title>
<style>body{margin:0;background:#162d27;color:white;font:16px sans-serif}header{height:52px;display:flex;align-items:center;gap:12px;padding:0 12px}button{font:inherit;padding:8px 12px}iframe{display:block;width:100%;height:calc(100vh - 52px);border:0}#status{white-space:pre-wrap}</style>
<header><button id="run">DPR 2 전체 입력 검사</button><button id="finish" disabled>이야기 끝까지 검사</button><span id="status">준비 중</span></header>
<iframe id="game"></iframe>
<script type="module">
import { ARTIFACTS, NICKNAMES } from '../prototype/src/story-data.js';
import {layoutGrid} from '../prototype/src/grid.js';
const frame=document.querySelector('iframe'),status=document.querySelector('#status'),results=[];
const wait=ms=>new Promise(r=>setTimeout(r,ms));
let w,d,canvas;
const assert=(condition,message)=>{results.push({pass:!!condition,message});if(!condition)throw Error(message);status.textContent=message;};
const report=()=>{document.body.dataset.results=JSON.stringify(results);};
let html=await (await fetch('../prototype/index.html')).text();
html=html.replace('<head>','<head><base href="../prototype/"><script>Object.defineProperty(window,"devicePixelRatio",{value:2});<\/script>');
frame.srcdoc=html;
await new Promise(r=>frame.addEventListener('load',r,{once:true}));
w=frame.contentWindow;d=frame.contentDocument;canvas=d.querySelector('canvas');
w.addEventListener('error',e=>{results.push({pass:false,message:e.message});report();});
w.addEventListener('unhandledrejection',e=>{results.push({pass:false,message:String(e.reason)});report();});
const phase=()=>d.querySelector('#stage').dataset.phase;
const event=(type,x,y)=>canvas.dispatchEvent(new w.PointerEvent(type,{bubbles:true,pointerId:1,pointerType:'touch',isPrimary:true,clientX:x,clientY:y,buttons:type==='pointerup'?0:1}));
function point(i){const dp=canvas.width/canvas.getBoundingClientRect().width;const l=layoutGrid({width:canvas.width,height:canvas.height-254*dp,cols:12,rows:7,padding:24*dp});l.y0+=112*dp;return {x:(l.x0+(i%12+.5)*l.cell)/dp,y:(l.y0+(Math.floor(i/12)+.5)*l.cell)/dp,cell:l.cell/dp};}
async function stroke(i,duration){const p=point(i);event('pointerdown',p.x-6,p.y);for(let k=0;k<duration/35;k++){await wait(35);event('pointermove',p.x+(k%2?6:-6),p.y);}event('pointerup',p.x,p.y);await wait(40);}
async function tap(i,delay=285){const p=point(i);event('pointerdown',p.x,p.y);event('pointerup',p.x,p.y);await wait(delay);}
async function advance(){d.querySelector('#dialogue').click();await wait(180);}
status.textContent='준비 완료';
document.querySelector('#run').onclick=async()=>{
 try{
  document.querySelector('#run').disabled=true;
  assert(phase()==='title','시작 화면 로딩');assert(canvas.width===Math.round(canvas.clientWidth*2),'DPR 2 캔버스');
  d.querySelector('#btn-start').click();await wait(250);
  for(let k=0;k<4;k++)await advance();assert(phase()==='dig','도입 4줄 뒤 발굴');
  // 연타와 과한 붓질을 실제 입력 경로로 재현한다.
  await stroke(39,750);await tap(39,45);await tap(39,45);await tap(39,45);await tap(39,45);
  assert(d.querySelector('#line').textContent.includes('와르르') || !d.querySelector('#dialogue').classList.contains('hidden'),'연타 시 반응 대사');
  await wait(2100);
  for(let i=39;i<=44;i++){
    if(i!==39)await stroke(i,750);
    await tap(i);await tap(i);await tap(i);
    if(i===39){
      const p=point(i);event('pointerdown',p.x-15,p.y);await wait(1);event('pointermove',p.x+15,p.y);event('pointerup',p.x+15,p.y);
      await wait(2100);
    }
    await stroke(i,1050);status.textContent=`금띠 ${i-38}/6 발굴`;
  }
  assert(phase()==='found','여섯 부분 발굴 뒤 발견 장면');
  assert(d.querySelector('#dialogue').classList.contains('hidden'),'발견 연출 중 대사 숨김');
  event('pointerdown',20,20);event('pointerup',20,20);await wait(400);
  assert(d.querySelector('#dialogue').classList.contains('hidden'),'연출 중 탭으로 대사가 건너뛰어지지 않음');
  await wait(2500);assert(d.querySelector('#line').textContent==='찾았다! 금관이야!','2.6초 뒤 발견 첫 대사');
  document.querySelector('#finish').disabled=false;status.textContent='발견 장면까지 통과 — 화면 검토 가능';report();
 }catch(e){status.textContent='실패: '+e.message;report();console.error(e);}
};
const click=selector=>{const el=d.querySelector(selector);if(!el)throw Error('Missing control: '+selector);el.click();};
async function talk(){for(let k=0;k<4;k++)await advance();}
async function investigate(index){
 assert(d.querySelector('#story').dataset.view==='inspect',`Artifact ${index+1}: inspection`);
 assert(d.querySelector('[data-action="infer"]').disabled,'Inference requires two observations');
 for(const o of ARTIFACTS[index].observations)click(`[data-observe="${o.id}"]`);
 click('[data-action="infer"]');
 click(`[data-choice="${1-ARTIFACTS[index].answer}"]`);
 assert(d.querySelector('#story').dataset.view==='infer','Incorrect inference can be retried');
 click(`[data-choice="${ARTIFACTS[index].answer}"]`);
 assert(d.querySelector('#story').dataset.view==='solved','Evidence earns a clue');
 click('[data-action="next"]');
}
document.querySelector('#finish').onclick=async()=>{
 const original=w.localStorage.getItem('silla-proto-log');
 const prior=w.localStorage.getItem('silla-first-exhibit-v1');
 try{
  document.querySelector('#finish').disabled=true;
  await talk();assert(phase()==='storyTalk','Turtle joins after crown');
  await talk();await investigate(0);
  for(let index=1;index<3;index++){
    await talk();assert(phase()==='dig',`Artifact ${index+1}: excavation starts`);
    for(const cell of ARTIFACTS[index].cells)await stroke(cell,1050);
    assert(phase()==='found',`Artifact ${index+1}: discovered`);
    await wait(2800);await talk();await investigate(index);
  }
  assert(d.querySelector('#story').dataset.view==='board','Three clues on evidence board');
  click('[data-action="known-name"]');assert(d.querySelector('#story').dataset.view==='board','Known name claim cannot advance');
  click('[data-action="unknown-name"]');click(`[data-nickname="${NICKNAMES[1]}"]`);click('[data-action="complete"]');
  assert(phase()==='museum'&&d.querySelectorAll('.museum-shelf article').length===3,'Museum contains three artifacts');
  const saved=JSON.parse(w.localStorage.getItem('silla-first-exhibit-v1'));
  assert(saved.nickname===NICKNAMES[1]&&saved.realNameKnown===false,'Nickname saved without claiming real name');
  click('[data-action="home"]');assert(phase()==='title','Return to title');
  assert(!d.querySelector('#btn-exhibit').classList.contains('hidden'),'Saved exhibit button visible');
  click('#btn-exhibit');assert(phase()==='museum','Reopen museum');
  click('[data-action="restart"]');await talk();await wait(2700);assert(phase()==='dig','Restart has no stale timers');
  assert(JSON.parse(w.localStorage.getItem('silla-first-exhibit-v1')).nickname===saved.nickname,'Restart preserves exhibit');
  const log=JSON.parse(w.localStorage.getItem('silla-proto-log'));
  assert(log.length===JSON.parse(original||'[]').length+1&&log.at(-1).choice==='no'&&log.at(-1).digMs>0,'One log entry for completed run');
  // Restore the exhibit after a full application reload.
  frame.contentWindow.location.reload();await new Promise(r=>frame.addEventListener('load',r,{once:true}));
  w=frame.contentWindow;d=frame.contentDocument;canvas=d.querySelector('canvas');
  click('#btn-exhibit');assert(phase()==='museum','Exhibit restored after reload');
  status.textContent='발굴·추리·전시·저장·재시작 모두 통과';report();
 }catch(e){status.textContent='실패: '+e.message;report();console.error(e);}
 finally{
  for(const [key,value] of [['silla-proto-log',original],['silla-first-exhibit-v1',prior]]){
    if(value===null)w.localStorage.removeItem(key);else w.localStorage.setItem(key,value);
  }
 }
};
</script>
